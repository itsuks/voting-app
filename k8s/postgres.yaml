apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      type: db
  template:
    metadata:
      name: postgres-pod
      labels:
        app: postgres
        type: db
    spec:
      containers:
        - name: postgres-container
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres