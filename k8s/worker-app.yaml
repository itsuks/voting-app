apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-app-deployment
  labels:
    name: worker-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-app
      type: back-end
  template:
    metadata:
      name: worker-app-pod
      labels:
        app: worker-app
        type: back-end
    spec:
      containers:
        - name: worker-app-container
          image: worker-app
          imagePullPolicy: Never