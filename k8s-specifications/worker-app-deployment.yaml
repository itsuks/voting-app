apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      name: worker-app-pod
      labels:
        app: worker
    spec:
      containers:
        - name: worker-app-container
          image: itsuks/worker-app
