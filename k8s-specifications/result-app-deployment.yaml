apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      name: result-app-pod
      labels:
        app: result
    spec:
      containers:
        - name: result-app-container
          image: itsuks/result-app
          ports:
          - containerPort: 80
